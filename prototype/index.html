<!DOCTYPE html>
<html lang="zh-CN">
<!--
  Paymory 原型 v2 · 温柔手帐（throwaway）
  方向：一本真的手帐。奶油纸纹底、便签卡歪着贴、和纸胶带、简笔贴纸、楷体手写、红笔金额、拍立得。
  纸底三种可切：点阵 / 横线 / 牛皮。v1（克制设计风）已被用户否决，勿回退。
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paymory · 手帐原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"Kaiti SC","KaiTi","STKaiti","DFKai-SB",-apple-system,"Microsoft YaHei",serif;
    background:linear-gradient(150deg,#75593f,#57422e);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:24px 12px 40px;
  }
  .stage-title { color:rgba(255,248,232,.75); font-size:13px; letter-spacing:2px; margin-bottom:14px; }

  /* ---------- 手机 ---------- */
  .phone { width:390px; height:812px; border-radius:46px; background:#2a2118; padding:11px;
    box-shadow:0 30px 90px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,240,210,.08); position:relative; flex-shrink:0; }
  .screen { width:100%; height:100%; border-radius:36px; overflow:hidden; position:relative; display:flex; flex-direction:column; color:#5a4a36; }

  /* ---------- 纸底 ---------- */
  .screen[data-paper="dot"]   { background-color:#fbf5e8; background-image:radial-gradient(circle,#e3d5b8 1.1px,transparent 1.2px); background-size:22px 22px; }
  .screen[data-paper="line"]  { background-color:#fdf9ee; background-image:repeating-linear-gradient(to bottom,transparent 0 27px,#e9dec4 27px 28px); }
  .screen[data-paper="kraft"] { background-color:#ead9b6; background-image:radial-gradient(ellipse at 20% 10%,rgba(255,250,235,.5),transparent 60%),radial-gradient(ellipse at 85% 90%,rgba(190,160,110,.28),transparent 55%); }

  .statusbar { height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 26px 0 30px; font-size:13px; font-weight:500; color:#7a6850; }
  .num { font-family:"Kaiti SC","KaiTi",serif; font-variant-numeric:tabular-nums; }
  #app { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
  #app::-webkit-scrollbar { display:none; }
  .pad { padding:6px 22px 130px; }

  /* ---------- 手写文字 ---------- */
  .h-hand { font-size:26px; color:#5a4a36; letter-spacing:2px; }
  .redpen { color:#b5432f; }
  .faint { color:#ab9a7d; font-size:12px; }

  /* ---------- 和纸胶带 ---------- */
  .tape { position:absolute; top:-9px; width:58px; height:19px; opacity:.82;
    clip-path:polygon(2% 0,98% 0,100% 88%,98% 100%,2% 100%,0 12%); z-index:2; }
  .tape.c0 { background:#e5aab0; } .tape.c1 { background:#b2c9a2; }
  .tape.c2 { background:#a7c2d6; } .tape.c3 { background:#efcd9a; }

  /* ---------- 便签卡 ---------- */
  .note {
    background:#fffdf4; border-radius:3px; padding:14px 16px 13px; position:relative;
    box-shadow:0 2px 8px rgba(150,125,85,.16), 0 1px 2px rgba(150,125,85,.1);
    margin:14px 4px 6px; transform:rotate(var(--r,0deg));
  }
  #app .note:nth-child(3n+1) { --r:-1.1deg; } #app .note:nth-child(3n+2) { --r:.9deg; } #app .note:nth-child(3n) { --r:-.3deg; }
  .note-top { display:flex; align-items:center; gap:9px; margin-bottom:5px; }
  .n-name { font-size:15px; color:#5a4a36; }
  .n-kind { font-size:11px; color:#ab9a7d; margin-left:auto; }
  .n-what { font-size:17px; color:#4c3e2c; margin:2px 0 5px; line-height:1.4; }
  .n-meta { display:flex; align-items:baseline; gap:8px; font-size:12px; color:#8a7960; }
  .n-amt { font-size:19px; margin-left:auto; margin-right:4px; }
  .n-note { font-size:13px; color:#96835f; margin-top:8px; padding-top:7px; border-top:1px dashed #e2d4b8; }
  .n-note::before { content:"↳ "; color:#c7b490; }
  .n-badge { font-size:10px; color:#b5432f; border:1.5px dotted #b5432f; border-radius:20px; padding:1px 7px 0; margin-left:6px; display:inline-block; transform:rotate(-2deg); }

  /* ---------- 简笔贴纸 ---------- */
  .sticker { width:36px; height:36px; background:#fff; border-radius:9px; flex-shrink:0;
    box-shadow:0 1px 4px rgba(140,115,80,.22); display:flex; align-items:center; justify-content:center;
    transform:rotate(var(--sr,-2deg)); border:1px solid rgba(190,170,135,.35); }
  .sticker svg { width:24px; height:24px; }

  /* ---------- 拍立得 ---------- */
  .polaroid { background:#fff; padding:10px 10px 12px; border-radius:3px; width:100%;
    box-shadow:0 3px 10px rgba(140,115,80,.2); position:relative; transform:rotate(-1.4deg); }
  .polaroid .photo { aspect-ratio:16/9; border-radius:2px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .polaroid .photo svg { width:44%; height:44%; opacity:.85; }
  .polaroid .cap { font-size:13px; color:#6b5a44; padding:9px 4px 0; line-height:1.5; }
  .polaroid .cap b { font-weight:normal; color:#b5432f; font-size:1.12em; }

  /* ---------- 首页头 ---------- */
  .home-head { display:flex; align-items:flex-end; justify-content:space-between; padding:14px 0 2px; }
  .paper-pick { display:flex; gap:7px; align-items:center; }
  .pp { width:26px; height:26px; border-radius:50% 46% 52% 48%; border:1.5px dashed #c9b790; cursor:pointer; box-shadow:0 1px 3px rgba(140,115,80,.2); transform:rotate(-3deg); }
  .pp:nth-child(2) { transform:rotate(2deg); } .pp:nth-child(3) { transform:rotate(-1deg); }
  .pp.dot { background-color:#fbf5e8; background-image:radial-gradient(circle,#d9c9a8 1px,transparent 1.1px); background-size:6px 6px; }
  .pp.line { background-color:#fdf9ee; background-image:repeating-linear-gradient(to bottom,transparent 0 5px,#d9cba9 5px 6px); }
  .pp.kraft { background:#d9c497; }
  .pp.on { border:2px solid #b5432f; }

  .day-mark { display:flex; align-items:center; gap:10px; margin:22px 0 4px; font-size:16px; color:#7a6850; }
  .day-mark .ln { flex:1; border-top:2px dotted #d5c5a4; }

  /* ---------- 档案行 ---------- */
  .arc-note { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .arc-main { flex:1; min-width:0; }
  .arc-figs { text-align:right; }
  .arc-days { font-size:19px; }
  .arc-sub2 { font-size:11px; color:#ab9a7d; margin-top:1px; }

  /* ---------- 详情 ---------- */
  .hero-wrap { padding:18px 12px 6px; display:flex; justify-content:center; }
  .trio { display:flex; gap:10px; margin:18px 4px 14px; justify-content:center; }
  .t3 { background:#fffdf4; border-radius:3px; padding:10px 14px 8px; text-align:center;
    box-shadow:0 2px 6px rgba(150,125,85,.15); transform:rotate(var(--r,0deg)); }
  .trio .t3:nth-child(1){--r:-2deg;} .trio .t3:nth-child(2){--r:1.5deg;} .trio .t3:nth-child(3){--r:-1deg;}
  .t3 .tv { font-size:20px; }
  .t3 .tl { font-size:11px; color:#ab9a7d; margin-top:2px; }
  .chips { display:flex; gap:8px; margin:4px 0 14px; flex-wrap:wrap; }
  .chip { font-size:13px; padding:4px 12px; border-radius:3px; background:rgba(255,253,244,.8); border:1.5px solid #d9c9a8; color:#8a7960; cursor:pointer; }
  .chip.on { border-color:#b5432f; color:#b5432f; }
  .tl-title { font-size:15px; color:#7a6850; margin:6px 0 10px; }
  .tl-item { position:relative; padding:0 0 16px 22px; }
  .tl-item::before { content:""; position:absolute; left:4px; top:10px; bottom:-6px; border-left:2px dotted #d5c5a4; }
  .tl-item:last-child::before { display:none; }
  .tl-item::after { content:""; position:absolute; left:0; top:6px; width:9px; height:9px; border-radius:50% 46% 52% 48%; background:#b5432f; opacity:.85; }
  .tl-date { font-size:12px; color:#ab9a7d; }
  .tl-what { font-size:16px; color:#4c3e2c; margin:1px 0 2px; }
  .tl-meta { font-size:13px; color:#8a7960; display:flex; gap:10px; flex-wrap:wrap; }
  .btn-hand {
    display:block; width:100%; padding:13px; border:none; font-family:inherit; font-size:17px; letter-spacing:3px;
    border-radius:60% 55% 58% 54% / 48% 60% 52% 58%;
    background:#b5432f; color:#fff8ec; cursor:pointer; margin-top:14px; box-shadow:0 3px 8px rgba(199,111,92,.35);
  }
  .btn-hand:active { transform:scale(.98); }

  /* ---------- 回望：拍立得墙 ---------- */
  .wall { display:grid; grid-template-columns:1fr 1fr; gap:16px 12px; padding-top:8px; }
  .wall .polaroid:nth-child(2n) { transform:rotate(1.6deg); }
  .wall .polaroid:nth-child(2n+1) { transform:rotate(-1.8deg); }
  .wall .polaroid:nth-child(3n) { transform:rotate(.6deg); }
  .wall .photo { aspect-ratio:1; }

  /* ---------- 纪念册（回望 · 夜页） ---------- */
  .screen[data-mood="night"] { background:#2b241d !important; background-image:none !important; color:#e8dcc4; }
  .screen[data-mood="night"] .tabbar { border-top-color:rgba(212,176,106,.3); }
  .screen[data-mood="night"] .tab { color:#8d7f66; }
  .screen[data-mood="night"] .tab.on { color:#d4b06a; background:rgba(212,176,106,.1); box-shadow:none; }
  .screen[data-mood="night"] .tab.on span { border-bottom-color:#d4b06a; }
  .screen[data-mood="night"] .statusbar { color:#a89877 !important; }
  .screen[data-mood="night"] .fab { display:none; }
  .night-pad { padding:34px 26px 150px; }
  .gp-eyebrow { text-align:center; letter-spacing:4px; font-size:12px; color:#a89877; white-space:nowrap; }
  .gp-eyebrow::before, .gp-eyebrow::after { content:"·"; margin:0 10px; color:#6b5f4c; }
  .n-big { font-size:68px; text-align:center; color:#e7c987; line-height:1.15; letter-spacing:1px; }
  .n-big small { font-size:16px; color:#a89877; letter-spacing:3px; display:block; margin-top:8px; }
  .n-sub { text-align:center; font-size:14px; color:#b7a687; margin-top:10px; letter-spacing:1px; }
  .n-sub b { color:#d4b06a; font-weight:normal; }
  .gp-sec { margin-top:34px; }
  .gp-title { font-size:15px; color:#c9b88f; letter-spacing:2px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:baseline; }
  .gp-title .en { font-size:11px; color:#6b5f4c; letter-spacing:1px; }
  .starfield { display:grid; grid-template-columns:repeat(26,1fr); gap:4px; padding:4px 2px; }
  .star { aspect-ratio:1; border-radius:50%; background:rgba(212,176,106,var(--a,.12)); animation:starIn .5s ease-out backwards; animation-delay:var(--d,0s); }
  @keyframes starIn { from { opacity:0; transform:scale(0); } to { opacity:1; transform:scale(1); } }
  .ring-wrap { display:flex; align-items:center; gap:22px; }
  .ring { width:118px; height:118px; flex-shrink:0; }
  .ring .track { stroke:rgba(212,176,106,.15); }
  .ring .arc { stroke:#e7c987; stroke-linecap:round; transform:rotate(-90deg); transform-origin:center;
    stroke-dasharray:var(--c); stroke-dashoffset:var(--off); animation:arcGrow 1.4s cubic-bezier(.3,.7,.3,1) .3s both; }
  @keyframes arcGrow { from { stroke-dashoffset:var(--c); } to { stroke-dashoffset:var(--off); } }
  .ring-copy .rl { font-size:15px; color:#c9b88f; line-height:1.7; }
  .ring-copy .rl b { font-size:26px; color:#e7c987; font-weight:normal; }
  .rank-row { margin-bottom:14px; }
  .rank-top { display:flex; justify-content:space-between; font-size:13px; color:#c9b88f; margin-bottom:5px; white-space:nowrap; }
  .rank-top .num { color:#e7c987; }
  .rank-bar { height:9px; border-radius:6px; background:rgba(212,176,106,.13); overflow:hidden; }
  .rank-bar i { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,#a8863f,#e7c987);
    width:var(--w); transform-origin:left; animation:barIn 1.1s cubic-bezier(.3,.7,.3,1) backwards; animation-delay:var(--d,0s); }
  @keyframes barIn { from { transform:scaleX(0); } }
  .axis { position:relative; height:74px; margin-top:8px; }
  .axis .line { position:absolute; left:0; right:0; top:14px; border-top:1.5px solid rgba(212,176,106,.4); }
  .axis .node { position:absolute; top:8px; width:13px; height:13px; border-radius:50%;
    background:#2b241d; border:2.5px solid #e7c987; }
  .axis .nd { position:absolute; top:30px; font-size:11px; color:#a89877; width:76px; margin-left:-32px; text-align:center; line-height:1.5; }
  .axis .nd b { color:#d4b06a; font-weight:normal; display:block; font-size:12px; }
  .gp-quote { margin-top:40px; text-align:center; font-size:17px; color:#c9b88f; letter-spacing:3px; line-height:2; }
  .gp-quote::before { content:"「"; color:#6b5f4c; }
  .gp-quote::after { content:"」"; color:#6b5f4c; }
  .rv-chips { display:flex; gap:8px; overflow-x:auto; padding:6px 0 10px; scrollbar-width:none; position:relative; }
  .rv-chips::-webkit-scrollbar { display:none; }
  .rv-chips::after { content:""; position:sticky; right:0; top:0; flex-shrink:0; width:26px; margin-left:-26px;
    background:linear-gradient(90deg,transparent,#2b241d 70%); pointer-events:none; }
  .rv-chip { flex-shrink:0; font-size:13px; padding:6px 14px; border-radius:3px; background:transparent;
    border:1px solid rgba(212,176,106,.35); color:#a89877; cursor:pointer; font-family:inherit; letter-spacing:1px; }
  .rv-chip.on { background:rgba(212,176,106,.14); border-color:#e7c987; color:#e7c987; }
  .n-trio { display:flex; justify-content:space-around; margin:26px 0 10px; }
  .n-trio .nt { text-align:center; }
  .n-trio .nt .v { font-size:29px; color:#e7c987; text-shadow:0 0 18px rgba(231,201,135,.35); }
  .n-trio .nt .l { font-size:12px; color:#b7a687; margin-top:5px; letter-spacing:2px; }
  .chart-box { width:100%; height:212px; margin-top:4px; }
  .rv-fade { animation:rvFadeUp .55s cubic-bezier(.25,.7,.3,1) both; }
  @keyframes rvFadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  .n-big { text-shadow:0 0 26px rgba(231,201,135,.3); }
  .rv-hero-name { text-align:center; font-size:22px; color:#e8dcc4; letter-spacing:4px; margin-top:2px; }

  /* ---------- 我的 ---------- */
  .me-head { display:flex; align-items:center; gap:14px; padding:18px 0 16px; }
  .me-ava { width:54px; height:54px; border-radius:46% 54% 50% 48%; background:#fffdf4; border:2px solid #d9c9a8;
    display:flex; align-items:center; justify-content:center; font-size:22px; color:#b5432f; transform:rotate(-3deg); }
  .set-note { display:flex; align-items:center; gap:10px; padding:14px 16px; background:#fffdf4;
    border-radius:3px; margin-bottom:12px; cursor:pointer; box-shadow:0 2px 6px rgba(150,125,85,.14); font-size:15px; color:#5a4a36; }
  .set-note .sv2 { margin-left:auto; font-size:12px; color:#ab9a7d; }
  .me-note { font-size:14px; color:#96835f; line-height:1.9; padding:10px 6px; }

  /* ---------- tab & FAB ---------- */
  .tabbar { flex-shrink:0; display:flex; border-top:2px dotted #d5c5a4; padding:7px 10px 20px; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 0 2px; cursor:pointer;
    color:#ab9a7d; border:none; background:none; font-family:inherit; font-size:13px; }
  .tab svg { width:21px; height:21px; }
  .tab.on { color:#b5432f; background:#fffdf4; border-radius:3px; box-shadow:0 1px 4px rgba(150,125,85,.18); transform:rotate(-1.5deg); }
  .tab.on span { border-bottom:2px solid #b5432f; padding-bottom:1px; }
  .fab { position:absolute; right:20px; bottom:92px; width:58px; height:58px; border:none; cursor:pointer;
    background:#fffdf4; border-radius:58% 62% 55% 61% / 60% 55% 62% 54%;
    box-shadow:0 4px 12px rgba(120,95,60,.3), inset 0 0 0 2px #d9c9a8;
    display:flex; align-items:center; justify-content:center; transform:rotate(-6deg); z-index:5;
    font-family:inherit; font-size:24px; color:#b5432f; }

  /* ---------- 记一笔抽屉（大便签） ---------- */
  .mask { position:absolute; inset:0; background:rgba(74,58,38,.42); opacity:0; pointer-events:none; transition:opacity .25s; z-index:8; }
  .mask.on { opacity:1; pointer-events:auto; }
  .sheet { position:absolute; left:10px; right:10px; bottom:10px; background:#fffdf4; border-radius:6px;
    padding:24px 20px 26px; z-index:9; transform:translateY(108%); transition:transform .32s cubic-bezier(.32,.72,.28,1);
    max-height:84%; overflow-y:auto; box-shadow:0 -6px 30px rgba(90,70,40,.3); }
  .sheet.on { transform:translateY(0); }
  .sheet h3 { font-size:20px; color:#4c3e2c; letter-spacing:2px; }
  .sh-sub { font-size:13px; color:#ab9a7d; margin:3px 0 16px; }
  .sense { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px 14px; font-family:inherit; font-size:15px;
    border:2px dotted #b5432f; border-radius:50px; background:transparent; color:#b5432f; cursor:pointer; margin-bottom:16px; }
  .fld { margin-bottom:13px; }
  .fld label { display:block; font-size:14px; color:#7a6850; margin-bottom:6px; }
  .fld input, .fld textarea { width:100%; padding:10px 13px; border:none; border-bottom:2px dashed #d9c9a8;
    background:rgba(251,245,232,.6); color:#4c3e2c; font-size:16px; font-family:inherit; outline:none; border-radius:4px 4px 0 0; }
  .fld input:focus, .fld textarea:focus { border-bottom-color:#b5432f; }
  .fld textarea { resize:none; height:52px; }
  .row2 { display:flex; gap:12px; } .row2 .fld { flex:1; }
  .pv-note { margin:10px 0 16px; }

  #toast { position:absolute; left:50%; bottom:128px; transform:translateX(-50%) translateY(8px);
    background:#5a4a36; color:#fbf5e8; font-size:14px; padding:9px 18px; border-radius:40px;
    opacity:0; pointer-events:none; transition:.25s; z-index:20; white-space:nowrap; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Apple HIG 触控与转场 v2（辅助对话参数清单） ---------- */
  /* 按下快（120ms standard）、松手弹（回弹曲线）——is-down 由 JS 事件委托管理 */
  .pressable { transition: transform .35s cubic-bezier(.34,1.56,.64,1), filter .3s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease-out; }
  .pressable.is-down { transition: transform .12s cubic-bezier(.25,.1,.25,1), filter .12s cubic-bezier(.25,.1,.25,1); transform: scale(.96); filter: brightness(.94); }
  .pressable.sm.is-down, .tab.is-down, .rv-chip.is-down, .chip.is-down, .pp.is-down { transform: scale(.92); }
  .note.pressable.is-down { transform: rotate(var(--r,0deg)) scale(.96); }
  .polaroid.is-down { transform: rotate(var(--r,-1.4deg)) scale(.97); }
  @media (hover:hover) and (pointer:fine) {
    .note.pressable:hover { transform: rotate(var(--r,0deg)) translateY(-3px); box-shadow:0 10px 22px rgba(150,125,85,.26); }
  }
  .fab { transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .fab.is-down { transform: rotate(-2deg) scale(.92); }
  .fab.spin { transform: rotate(39deg); }
  .tab { transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
  .tab.on svg { animation: tabPop .2s cubic-bezier(.34,1.56,.64,1); }
  @keyframes tabPop { from { transform: scale(.92); } to { transform: scale(1); } }
  .rv-chip, .chip, .pp { transition: transform .3s cubic-bezier(.34,1.56,.64,1), background .15s, border-color .15s, color .15s; }
  .rv-chip.on, .chip.on { animation: chipPop .15s cubic-bezier(.34,1.56,.64,1); }
  @keyframes chipPop { from { transform: scale(.95); } to { transform: scale(1); } }
  .polaroid { transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease-out; }

  /* 入场：ease-out 减速曲线（迎面而来），24ms 交错，10 项封顶 */
  .stagger-in { animation: riseIn .24s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i,0) * 24ms); }
  @keyframes riseIn {
    from { opacity:0; transform: translateY(24px) rotate(var(--r,0deg)); }
    to   { opacity:1; transform: translateY(0) rotate(var(--r,0deg)); }
  }

  /* sheet：500ms iOS 曲线弹出 / 300ms 加速收起 / 拖拽时无过渡 */
  .sheet { transition: transform .5s cubic-bezier(.32,.72,0,1); }
  .sheet.closing { transition: transform .3s cubic-bezier(.4,0,1,1); }
  #app { transition: transform .5s cubic-bezier(.32,.72,0,1), filter .5s cubic-bezier(.32,.72,0,1); }
  .screen.sheet-open #app { transform: scale(.96) translateY(-6px); filter: brightness(.88); }
  .sheet-grip { width:32px; height:4px; border-radius:3px; background:#dccfb2; margin:0 auto 14px; cursor:grab; touch-action:none; }
  .sheet-grip:active { cursor:grabbing; }

  /* 落值脉冲（count-up 收尾确认） */
  .pulse-once { animation: settlePulse .18s ease-out; }
  @keyframes settlePulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* View Transitions：方向感 push（old 视差退场，new 迎面进；--vtx 符号由 JS 按前进/返回切换） */
  ::view-transition-old(root) { animation: vtOut .35s cubic-bezier(.4,0,1,1) both; }
  ::view-transition-new(root) { animation: vtIn .35s cubic-bezier(.22,1,.36,1) both; }
  @keyframes vtOut { to { opacity:0; transform: translateX(calc(var(--vtx,24px) * -1)); } }
  @keyframes vtIn { from { opacity:0; transform: translateX(var(--vtx,24px)); } }
  ::view-transition-group(flycard), ::view-transition-old(flycard), ::view-transition-new(flycard) {
    animation-duration: .42s; animation-timing-function: cubic-bezier(.32,.72,0,1);
  }
  ::view-transition-new(flycard) { overflow: clip; }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
    .stagger-in, .rv-fade, .tab.on svg, .rv-chip.on, .chip.on { animation: none !important; }
  }

  @media (max-width:430px) {

    .phone { width:100vw; height:100vh; border-radius:0; padding:0; }
    .screen { border-radius:0; }

const GOLD = ["#e7c987","#c9a86a","#d98e73","#b7c9a0","#a7c2d6","#d4a5a5","#c9b88f","#9db8a8"];

function disposeNightCharts(){
  if (typeof echarts === "undefined") return;
  ["chartTrend","chartRose","chartArc"].forEach(id => {
    const el = document.getElementById(id);
    if (el){ const c = echarts.getInstanceByDom(el); if (c) c.dispose(); }
  });
}
/* 数字滚动：easeOutExpo + 落值脉冲，600–900ms 按位数 */
function countUp(id, target, prefix, dur){
  const el = document.getElementById(id);
  if (!el) return;
  const hasSmall = el.querySelector("small");
  const set = v => { if (hasSmall && el.childNodes[0]) { el.childNodes[0].nodeValue = v; } else { el.textContent = v; } };
  const t0 = performance.now();
  const step = t => {
    const p = Math.min(1,(t-t0)/(dur||800));
    const ease = p===1 ? 1 : 1 - Math.pow(2, -10*p);
    set((prefix||"") + Math.round(target*ease).toLocaleString());
    if (p<1) requestAnimationFrame(step);
    else { el.classList.add("pulse-once"); setTimeout(() => el.classList.remove("pulse-once"), 200); }
  };
  requestAnimationFrame(step);
}
function startCounters(){
  if (state.rvTab === "all"){
    countUp("cntA", 386, "", 600);
    countUp("cntB", 28412, "¥", 900);
    countUp("cntC", 8, "", 500);
  } else {
    const a = ARCHIVES[state.rvTab];
    countUp("cntDays", daysSince(a.since), "", 900);
    countUp("cntT", a.total, "¥", 800);
    countUp("cntN", a.count, "", 600);
    countUp("cntAvg", Math.round(a.total/a.count), "¥", 650);
  }
}

function sheetChips(pre){
  let h = "";
  Object.keys(ARCHIVES).forEach(k => {
    h += '<span class="chip' + (k===pre?" on":"") + '" onclick="pickArc(this)">' + ARCHIVES[k].name + "</span>";
  });
  return h + '<span class="chip" onclick="pickArc(this)">不贴</span>';
}
function pickArc(el){
  document.querySelectorAll("#fArcs .chip").forEach(c => c.classList.remove("on"));
  el.classList.add("on"); updPv();
}

function updPv(){

  const on = document.querySelector("#fArcs .chip.on");

const IC = {

  time:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',

function renderTabs(){
  const tabs = [ ["home","首页",IC.home], ["archives","档案",IC.book], ["review","回望",IC.time], ["me","我的",IC.me] ];
  document.getElementById("tabbar").innerHTML = tabs.map(t =>

/* 触觉（Android 震动；iOS Safari 静默跳过，视觉反馈已由按压承担） */
function hap(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
/* 按下快、松手弹：事件委托统一管理 is-down */
  document.addEventListener("pointerdown", e => {
    const el = e.target.closest(".pressable, .fab, .tab, .rv-chip, .chip, .pp, .polaroid");
    if (el) el.classList.add("is-down");
  });
["pointerup","pointercancel"].forEach(ev =>
  document.addEventListener(ev, () => {
    document.querySelectorAll(".is-down").forEach(el => el.classList.remove("is-down"));
  }, true));
function go(t){
  hap(10);
  const back = t === "home" && state.tab === "detail";
  wrapVT(() => { state.tab = t; render(); document.getElementById("app").scrollTop = 0; }, back);
}
function openDetail(k, el){
  const run = () => { state.detail = k; state.tab = "detail"; render(); document.getElementById("app").scrollTop = 0; };
  if (el && document.startViewTransition){
    el.style.viewTransitionName = "flycard";
    wrapVT(run, false);
    setTimeout(() => { el.style.viewTransitionName = ""; }, 470);
  } else wrapVT(run, false);
}
function go2detail(k){ wrapVT(() => { state.detail = k; render(); }, true); }
function setPaper(p){ state.paper = p; document.getElementById("screen").dataset.paper = p; wrapVT(render, false); }
function wrapVT(fn, back){
  document.documentElement.style.setProperty("--vtx", back ? "-24px" : "24px");
  if (document.startViewTransition) document.startViewTransition(fn);
  else fn();
}
function openSheet(pre){
  hap(10);
  document.getElementById("sheet").innerHTML = renderSheet(pre || "laowang");
  bindSheetInputs();
  bindSheetDrag();
  document.getElementById("fab").classList.add("spin");
  requestAnimationFrame(() => {
    document.getElementById("sheet").classList.add("on");
    document.getElementById("mask").classList.add("on");
    document.getElementById("screen").classList.add("sheet-open");
  });
}
function closeSheet(){
  const sheet = document.getElementById("sheet");
  sheet.classList.remove("on");
  sheet.classList.add("closing");
  setTimeout(() => sheet.classList.remove("closing"), 320);
  document.getElementById("mask").classList.remove("on");
  document.getElementById("screen").classList.remove("sheet-open");
  document.getElementById("fab").classList.remove("spin");
}
function bindSheetDrag(){
  const sheet = document.getElementById("sheet");
  const grip = document.getElementById("sheetGrip");
  const mask = document.getElementById("mask");
  if (!grip || grip._bound) return;
  grip._bound = true;
  let y0 = 0, dy = 0, dragging = false, lastT = 0, lastY = 0, vel = 0, H = 1;
  grip.addEventListener("pointerdown", e => {
    dragging = true; y0 = e.clientY; dy = 0; vel = 0;
    lastT = performance.now(); lastY = y0;
    H = sheet.offsetHeight || 500;
    sheet.style.transition = "none";
    mask.style.transition = "none";
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener("pointermove", e => {
    if (!dragging) return;
    dy = Math.max(0, e.clientY - y0);
    const now = performance.now();
    vel = (e.clientY - lastY) / Math.max(1, now - lastT);
    lastT = now; lastY = e.clientY;
    sheet.style.transform = "translateY(" + dy + "px)";
    mask.style.opacity = String(Math.max(0, 1 - dy / (H * .6)));
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = ""; sheet.style.transform = "";
    mask.style.transition = ""; mask.style.opacity = "";
    if (dy > H * .3 || vel > .5) closeSheet();
    dy = 0;
  };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
}
function bindSheetInputs(){
  ["fShop","fWhat","fAmt"].forEach(id => {
    const el = document.getElementById(id);
    if (el && !el._bound) { el.addEventListener("input", updPv); el._bound = true; }
  });
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
}
function tick(){
  const n = new Date();
  document.getElementById("statusbar").innerHTML =
    '<span class="num">' + String(n.getHours()).padStart(2,"0") + ":" + String(n.getMinutes()).padStart(2,"0") + "</span>" +
    '<span style="font-size:11px">Paymory</span>';
}
document.getElementById("fab").onclick = () => openSheet();
document.getElementById("mask").onclick = closeSheet;
tick(); setInterval(tick, 30000);
render();
</script>
